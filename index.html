<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de alunos</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="script.js" />
    <style>
      .aprovado {
        color: green;
      }
      .reprovado {
        color: red;
      }
    </style>
  </head>
  <body>
    <form action="" id="formulario">
      <label for="nome">Nome</label>
      <input required type="text" id="nome" name="nome" /><br />

      <label for="idade">Idade</label>
      <input
        required
        min="0"
        max="120"
        type="number"
        id="idade"
        name="idade"
      /><br />

      <label for="turma">Turma</label>
      <select name="" id="turma" required>
        <option value="">Escolha a turma</option>
        <option value="1a">1°A</option>
        <option value="1b">1°B</option></select
      ><br />

      <label for="nota1">Nota 1</label>
      <input
        required
        type="number"
        id="nota1"
        name="nota1"
        step="0.1"
        min="0"
        max="10"
      /><br />

      <label for="nota2">Nota 2</label>
      <input
        required
        type="number"
        id="nota2"
        name="nota2"
        step="0.1"
        min="0"
        max="10"
      /><br />

      <button type="submit">Enviar</button>
      <button type="reset">Limpar</button>
    </form>
    <p id="alerta"></p>

    <p id="total">Total de Alunos 0</p>
    <p id="reprovados">Total de Reprovados 0</p>
    <p id="aprovados">Total de Aprovados 0</p>
    <p>Alunos Cadastrados</p>
    <ul id="lista"></ul>
    <script>
      const formulario = document.querySelector("#formulario");
      const nome = document.querySelector("#nome");
      const idade = document.querySelector("#idade");
      const turma = document.querySelector("#turma");
      const nota1 = document.querySelector("#nota1");
      const nota2 = document.querySelector("#nota2");
      const alerta = document.querySelector("#alerta");
      const lista = document.querySelector("#lista");
      const total = document.querySelector("#total");
      const reprovados = document.querySelector("#reprovados");
      const aprovados = document.querySelector("#aprovados");

      let alunosReprovados = 0;
      let alunosAprovados = 0;
      let alunosTotal = 0;
      formulario.addEventListener("submit", (event) => {
        event.preventDefault();

        const nomeDigitado = nome.value.trim();

        const valorNota1 = Number(nota1.value);
        const valorNota2 = Number(nota2.value);
        const media = (valorNota1 + valorNota2) / 2;

        let situacao = "";
        if (media >= 7) {
          situacao = "aprovado";
          alunosAprovados++;
        } else {
          situacao = "reprovado";
          alunosReprovados++;
        }

        alunosTotal++;

        const item = document.createElement("li");
        item.textContent =
          "Nome: " +
          nome.value +
          " - Idade: " +
          idade.value +
          " - Turma: " +
          turma.value +
          " - Nota 1: " +
          nota1.value +
          " - Nota 2: " +
          nota2.value +
          " - Média: " +
          media +
          " - situação: " +
          situacao;
        const btn = document.createElement("button");
        btn.textContent = "remover";

        btn.addEventListener("click", function () {
          item.remove();

          let situacao = "";
          if (media >= 7) {
            situacao = "aprovado";
            alunosAprovados--;
          } else {
            situacao = "reprovado";
            alunosReprovados--;
          }

          alunosTotal--;

          total.textContent = "Total de Alunos " + alunosTotal;
          aprovados.textContent = "Total de Aprovados " + alunosAprovados;
          reprovados.textContent = "Total de Reprovados " + alunosReprovados;
        });
        item.appendChild(btn);

        lista.appendChild(item);
        total.textContent = "Total de Alunos " + alunosTotal;
        aprovados.textContent = "Total de Aprovados " + alunosAprovados;
        reprovados.textContent = "Total de Reprovados " + alunosReprovados;
      });
    </script>
  </body>
</html>
